name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy medical_form_automation

  test:
    runs-on: ubuntu-latest
    env:
      MFA_GEMINI_API_KEY: ci-gemini-key
      MFA_LLAMA_PARSE_API_KEY: ci-llamaparse-key
      MFA_LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: medical-form-automation:ci
          load: true
      - name: Smoke test image
        run: |
          docker run -d --name mfa \
            -e MFA_GEMINI_API_KEY=ci \
            -e MFA_LLAMA_PARSE_API_KEY=ci \
            -p 8000:8000 \
            medical-form-automation:ci
          for i in {1..15}; do
            if curl -fs http://localhost:8000/healthz; then
              echo " healthz OK"; break
            fi
            sleep 2
          done
          docker logs mfa
          docker rm -f mfa
