[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-form-automation"
version = "0.2.0"
description = "AI-powered medical form automation using LLMs to extract patient data from unstructured documents and populate standardized PDF forms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Enes Sinan Parildi"}
]
keywords = [
    "medical-automation",
    "healthcare-ai",
    "llm",
    "form-filling",
    "pdf-processing",
    "gemini",
    "llamaparse",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "pypdf>=3.17.0",

    "llama-parse>=0.4.0",
    "llama-index-core>=0.10.0",
    "llama-index-llms-google-genai>=0.2.0",

    "pgeocode>=0.4.0",
    "usaddress>=0.5.10",
    "phonenumbers>=8.13.0",
    "python-dateutil>=2.8.2",

    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",

    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",

    "structlog>=24.1.0",

    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

ocr = [
    "layoutparser>=0.3.4",
    "pdf2image>=1.16.3",
    "opencv-python>=4.8.0",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.23.0",
]

[project.urls]
Repository = "https://github.com/enessinanparildi/LLM-Medical-Form-Automation-Pipeline"

[project.scripts]
extract-schema = "medical_form_automation.pdf_extraction:main"
extract-data = "medical_form_automation.extraction:main"
populate-pdf = "medical_form_automation.pdf_populate:main"
evaluate-soap = "medical_form_automation.soap_eval:main"

[tool.setuptools.packages.find]
include = ["medical_form_automation*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["output", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=medical_form_automation",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
    "-v",
]
markers = [
    "integration: live LLM/LlamaParse calls (skipped by default)",
]

[tool.coverage.run]
source = ["medical_form_automation"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/soap_eval.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
